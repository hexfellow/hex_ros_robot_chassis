# rate
ctrl_rate: 1000.0
rate_state: 500.0

# robot connection
robot_host: "192.168.1.100"
robot_port: 8439

# frame id
robot_frame_id: "base_link"

# driver state buffer size
state_buffer_size: 200

# sensor timestamp enable
sens_ts: true

# KCP transport
enable_kcp: true

# robot type: 30 = X4H1, 31 = L4H1
robot_type: 30

